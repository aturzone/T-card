<!doctype html>
<html lang="en" data-theme="light" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T-Card — Gift cards, beautifully delivered</title>
    <meta name="description" content="Premium digital gift cards for the world's best brands. Delivered in under 90 seconds." />
    <!-- Self-hosted fonts only (no network at runtime). Latin via @fontsource
         inter / inter-tight / jetbrains-mono, Persian via @fontsource/estedad,
         all bundled in /assets/. See src/styles/index.css. -->
    <link rel="icon" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tcard.theme') || 'light';
          var l = localStorage.getItem('tcard.lang') || 'en';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-lang', l);
          document.documentElement.setAttribute('dir', l === 'fa' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

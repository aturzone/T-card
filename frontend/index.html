<!doctype html>
<html lang="en" data-theme="light" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T-Card — Gift cards, beautifully delivered</title>
    <meta name="description" content="Premium digital gift cards for the world's best brands. Delivered in under 90 seconds." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontcdn.ir" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://v1.fontapi.ir/css/Estedad" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tcard.theme') || 'light';
          var l = localStorage.getItem('tcard.lang') || 'en';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.setAttribute('data-lang', l);
          document.documentElement.setAttribute('dir', l === 'fa' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
